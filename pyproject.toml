[build-system]
requires = ["setuptools>=82.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "understory"
version = "0.1.0"
description = "Forest Structural Complexity Tool — modernized as Understory"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.13"
dependencies = [
    # Core scientific
    "numpy>=2.3",
    "scipy>=1.17",
    "pandas>=3.0",
    "matplotlib>=3.10",

    # Point cloud I/O
    "laspy>=2.7",
    "open3d>=0.19",

    # ML / Deep Learning (install torch separately, see README)
    # torch>=2.10.0+cu128 — install via: pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cu128
    # torch-geometric     — install via: pip install torch-geometric
    # torch-cluster, torch-scatter, torch-sparse — pip install ... -f https://data.pyg.org/whl/torch-2.10.0+cu128.html
    "torch-geometric>=2.7",

    # ML utilities
    "scikit-learn>=1.8",
    "scikit-image>=0.26",
    "scikit-spatial>=9.0",
    "hdbscan>=0.8.41",
    "networkx>=3.6",

    # GUI
    "PySide6>=6.10",
    "pyvista>=0.47",
    "pyvistaqt>=0.11",

    # Config & reporting
    "pyyaml>=6.0",
    "Jinja2>=3.1",
    "Markdown>=3.10",
    "mdutils>=1.8",

    # GIS export
    "geopandas>=1.1",

    # Video export
    "imageio-ffmpeg>=0.6",

    # Misc
    "Pillow>=12.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-qt>=4.5",
    "ruff>=0.15",
]

[project.scripts]
understory = "understory.__main__:main"

[project.gui-scripts]
understory-gui = "understory.__main__:main"

[tool.setuptools.packages.find]
include = ["understory*"]

[tool.setuptools.package-data]
"understory.resources" = ["icons/*", "styles/*"]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that run the full pipeline (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 120
target-version = "py310"
